<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b0d">
<title>SKYECCWEB</title>
<style>
:root{--green:#55ff83;--green2:#16c95b;--panel:#151a1e;--line:#354047;--muted:#a6b0b5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#edf3f4;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 5%,#263239 0,#11171b 38%,#050708 100%);padding:30px 18px 24px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(115deg,transparent 0 3px,rgba(255,255,255,.025) 4px,transparent 5px 9px)}
main{position:relative;max-width:1050px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:5px 0 52px}
.brand{font-size:clamp(25px,4vw,38px);font-weight:800;letter-spacing:.12em;text-shadow:0 0 18px #55ff8340}
.brand span{color:var(--green)}
.clock{text-align:right;color:var(--green);font-family:Consolas,monospace;text-shadow:0 0 14px #55ff8370}
#time{font-size:clamp(23px,4vw,34px);letter-spacing:.06em}
#date{font-size:12px;color:#b9d8c2;margin-top:5px}
.search-wrap{max-width:760px;margin:0 auto 48px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.28em;color:#b5c0c5;margin-bottom:15px}
.search{display:flex;padding:7px;background:linear-gradient(145deg,#283137,#0c1114);border:1px solid #59666d;border-radius:13px;box-shadow:0 12px 35px #0009,inset 0 1px #ffffff16}
.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;font-size:17px;padding:13px 15px}
.search button,.action{border:1px solid #4c8b61;background:linear-gradient(#21442d,#102619);color:#caffd5;border-radius:9px;padding:0 22px;font-weight:bold;cursor:pointer}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 17px}
.section-head h2{font-size:13px;letter-spacing:.2em;color:#c4cdd1;font-weight:600}
.action{padding:9px 14px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:15px}
.tile{position:relative;min-height:116px;border:1px solid #3b474d;border-radius:13px;background:linear-gradient(145deg,#222a2f,#101518 72%);box-shadow:0 9px 22px #0008,inset 0 1px #ffffff12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#edf3f4;transition:.18s}
.tile:hover{transform:translateY(-3px);border-color:var(--green);box-shadow:0 10px 28px #000a,0 0 16px #55ff8320}
.tile .symbol{font-size:29px;color:var(--green);font-weight:bold;text-shadow:0 0 15px #55ff8355}
.tile .name{font-size:13px;letter-spacing:.04em}
.tile .remove{display:none;position:absolute;right:7px;top:6px;border:0;background:#47252a;color:white;border-radius:50%;width:23px;height:23px;cursor:pointer}
.editing .tile .remove{display:block}
footer{text-align:center;margin-top:55px;color:#758187;font-size:10px;letter-spacing:.28em}
.note{text-align:center;color:#879398;font-size:11px;margin-top:16px;line-height:1.5}
dialog{width:min(420px,calc(100% - 30px));border:1px solid #536169;border-radius:14px;background:linear-gradient(145deg,#20292e,#0c1114);color:#eef4f4;padding:22px;box-shadow:0 20px 70px #000}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
dialog h3{margin:0 0 18px;color:var(--green)}
label{display:block;font-size:12px;color:#b8c3c7;margin:12px 0 6px}
dialog input{width:100%;padding:11px;border:1px solid #48565d;border-radius:8px;background:#090e11;color:white}
.dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.dialog-actions button{padding:10px 14px;border-radius:8px;cursor:pointer;border:1px solid #56636a;background:#20292e;color:white}
.dialog-actions button[type=submit]{background:#174a29;border-color:#4c9c65;color:#d8ffe0}
@media(max-width:600px){body{padding:20px 14px}header{margin-bottom:38px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.search button{padding:0 14px}.search input{font-size:15px}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">SKY<span>ECC</span>WEB</div>
  <div class="clock"><div id="time">00:00:00</div><div id="date"></div></div>
</header>
<section class="search-wrap">
  <div class="eyebrow">BUSCADOR · STARTPAGE</div>
  <form class="search" action="https://www.startpage.com/do/search" method="get">
    <input type="hidden" name="prfe" value="86f22efb9d52344cb14122c9362d57d6ac896cacb71f5fc2a9f9dc21b4f49f1fade31dc2e309b3a347a6cdab6adb3f43d359927c51fc6171bee8d42ea03a156c333eae761b292890e5c15f27deaf">
    <input name="query" type="search" placeholder="¿Qué quieres buscar?" aria-label="Buscar en Startpage" required>
    <button type="submit">BUSCAR ↗</button>
</form>
</section>
<section>
  <div class="section-head"><h2>ACCESOS DIRECTOS</h2><button class="action" id="editBtn">⚙ EDITAR</button></div>
  <div class="tiles" id="tiles"></div>
  <div class="note">Pulsa «Editar» para añadir tus páginas y cambiar sus direcciones.</div>
</section>
<footer>SKYECCWEB · TU PÁGINA DE INICIO</footer>
</main>
<dialog id="editor">
  <form id="tileForm">
    <h3 id="formTitle">Añadir acceso directo</h3>
    <label for="tileName">Nombre</label><input id="tileName" maxlength="30" placeholder="Ej. Mi correo" required>
    <label for="tileUrl">Dirección web</label><input id="tileUrl" type="url" placeholder="https://ejemplo.com" required>
    <label for="tileIcon">Icono o letra (opcional)</label><input id="tileIcon" maxlength="4" placeholder="Ej. ✉">
    <div class="dialog-actions"><button type="button" id="cancelBtn">Cancelar</button><button type="submit">Guardar</button></div>
  </form>
</dialog>
<script>
const defaults=[
 {name:"YouTube",url:"https://www.youtube.com",icon:"▶"},
 {name:"Gemini",url:"https://gemini.google.com",icon:"✦"},
 {name:"X",url:"https://x.com",icon:"𝕏"},
 {name:"Gmail",url:"https://mail.google.com",icon:"✉"}
];
const key="skyeccweb-shortcuts-v1";
let items;try{items=JSON.parse(localStorage.getItem(key))||defaults}catch{items=defaults}
let editing=false,editIndex=-1;
const tiles=document.getElementById("tiles"),dialog=document.getElementById("editor");
function save(){localStorage.setItem(key,JSON.stringify(items));render()}
function render(){
 tiles.innerHTML="";
 items.forEach((item,i)=>{
  const a=document.createElement("a");a.className="tile";a.href=item.url;a.target="_blank";a.rel="noopener noreferrer";
  const symbol=document.createElement("span");symbol.className="symbol";symbol.textContent=item.icon||"↗";
  const name=document.createElement("span");name.className="name";name.textContent=item.name;
  a.append(symbol,name);
  a.addEventListener("click",e=>{if(editing){e.preventDefault();openEditor(i)}});
  const remove=document.createElement("button");remove.className="remove";remove.type="button";remove.textContent="×";remove.title="Eliminar";
  remove.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();items.splice(i,1);save()});
  a.append(remove);tiles.append(a);
 });
 if(editing){const add=document.createElement("button");add.className="tile";add.type="button";add.innerHTML='<span class="symbol">＋</span><span class="name">Añadir cuadro</span>';add.addEventListener("click",()=>openEditor(-1));tiles.append(add)}
 document.body.classList.toggle("editing",editing);
}
function openEditor(i){editIndex=i;document.getElementById("formTitle").textContent=i<0?"Añadir acceso directo":"Editar acceso directo";
 const item=i<0?{name:"",url:"https://",icon:""}:items[i];
 document.getElementById("tileName").value=item.name;document.getElementById("tileUrl").value=item.url;document.getElementById("tileIcon").value=item.icon||"";dialog.showModal()}
document.getElementById("editBtn").addEventListener("click",()=>{editing=!editing;document.getElementById("editBtn").textContent=editing?"✓ TERMINAR":"⚙ EDITAR";render()});
document.getElementById("cancelBtn").addEventListener("click",()=>dialog.close());
document.getElementById("tileForm").addEventListener("submit",e=>{e.preventDefault();const item={name:document.getElementById("tileName").value.trim(),url:document.getElementById("tileUrl").value.trim(),icon:document.getElementById("tileIcon").value.trim()||"↗"};if(editIndex<0)items.push(item);else items[editIndex]=item;save();dialog.close()});
function tick(){const d=new Date();document.getElementById("time").textContent=d.toLocaleTimeString("es-ES");document.getElementById("date").textContent=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
tick();setInterval(tick,1000);render();
</script>
</body>
</html>
