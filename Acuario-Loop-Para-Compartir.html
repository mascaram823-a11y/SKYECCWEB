<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acuario XP - Bucle Infinito</title>
<meta property="og:title" content="Acuario XP - Bucle Infinito">
<meta property="og:description" content="Acuario mítico de Windows XP en bucle infinito">
<meta property="og:type" content="video.other">
<meta property="og:video" content="https://mascaram823-a11y.github.io/SKYECCWEB/acuario_web.mp4">
<meta property="og:video:type" content="video/mp4">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#tap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#fff;font-family:system-ui;font-size:20px;z-index:10;cursor:pointer}
#tap.hide{display:none}
</style>
</head>
<body>
<video id="v" loop playsinline autoplay muted controls>
  <source src="https://mascaram823-a11y.github.io/SKYECCWEB/acuario_web.mp4" type="video/mp4">
  <source src="./acuario_web.mp4" type="video/mp4">
</video>
<div id="tap">▶ Toca para activar sonido en bucle</div>
<script>
const v=document.getElementById('v'); const tap=document.getElementById('tap');
v.play().catch(()=>{});
tap.addEventListener('click',()=>{
  v.muted=false; v.volume=0.8; v.play(); tap.classList.add('hide');
});
v.addEventListener('click',()=>{
  if(v.muted){ v.muted=false; v.play(); tap.classList.add('hide'); }
});
v.addEventListener('ended',()=>{ v.currentTime=0; v.play(); });
</script>
</body>
</html>
